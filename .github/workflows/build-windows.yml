name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "python/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to the locally verified combination (Python 3.12 +
          # PySide6 6.12). Do not float to a newer Python until its
          # PySide6 wheels are confirmed to exist and tests pass on it.
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
          pip install -r python/requirements-dev.txt

      - name: Generate icon
        # assets/app.ico is a binary and is not kept in the repo snapshot;
        # it is regenerated from generate_icon.py (Pillow, from dev reqs).
        run: python python/generate_icon.py

      - name: Verify test discovery is not empty
        working-directory: python
        run: |
          $count = python -c "import unittest; print(unittest.defaultTestLoader.discover('tests').countTestCases())"
          Write-Host "Discovered $count tests"
          if ([int]$count -le 0) { throw "Test discovery found 0 tests; refusing a false-green build" }

      - name: Run tests
        working-directory: python
        run: python -m unittest discover -s tests -v

      - name: Ensure Inno Setup
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
          }

      - name: Build exe and installer
        run: python python/build.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Looking-exe
          path: python/dist/WiFi-Looking.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Looking-Setup
          path: python/dist/WiFi-Looking-Setup.exe
          if-no-files-found: warn
