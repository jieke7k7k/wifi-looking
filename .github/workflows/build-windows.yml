name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "python/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to the locally verified combination (Python 3.12 +
          # PySide6 6.12, exact version pinned in requirements.txt).
          # Do not float to a newer Python until its PySide6 wheels
          # are confirmed to exist and tests pass on it.
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
          pip install -r python/requirements-dev.txt
          pip install -r python/requirements-windows.txt

      - name: Verify app icon
        # python/assets/app.ico is the user-confirmed XiaoMaLink icon
        # (rounded teal base, arc + two dots + lightning) and is kept
        # in the repo snapshot; it must never be regenerated from
        # generate_icon.py, which still draws the old line-style icon.
        # Pillow comes from requirements-dev.txt.
        run: |
          python -c "from PIL import Image; im = Image.open('python/assets/app.ico'); frames = set(im.info.get('sizes', set())); assert frames == {(16, 16), (32, 32), (48, 48), (256, 256)}, frames; print('app.ico frames OK:', sorted(frames))"

      - name: Verify test discovery is not empty
        working-directory: python
        run: |
          $count = python -c "import unittest; print(unittest.defaultTestLoader.discover('tests').countTestCases())"
          Write-Host "Discovered $count tests"
          if ([int]$count -le 0) { throw "Test discovery found 0 tests; refusing a false-green build" }

      - name: Run tests
        working-directory: python
        run: python -m unittest discover -s tests -v

      - name: Ensure Inno Setup
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
          }

      - name: Build exe and installer
        run: python python/build.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: XiaoMaLink-exe
          path: python/dist/XiaoMaLink.exe
          if-no-files-found: error

      - name: Assert installer seed config ships no rules
        working-directory: python
        run: |
          python -c "import json; cfg=json.load(open('dist/config.json', encoding='utf-8')); assert cfg['rules'] == [], 'seed config must ship without rules'; print('seed config OK')"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: XiaoMaLink-Setup
          path: python/dist/XiaoMaLink_Setup_v1.1.0.exe
          if-no-files-found: error
